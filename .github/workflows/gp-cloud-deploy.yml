name: gp-cloud Preview Deploy

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  deploy:
    if: github.event.issue.pull_request && startsWith(github.event.comment.body, '/deploy')
    runs-on: ubuntu-latest
    environment:
      name: gp-cloud-preview
      url: ${{ steps.deploy.outputs.preview_url }}
    steps:
      - name: Queue exact PR commit in gp-cloud
        id: deploy
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const token = (await github.auth()).token;
            const response = await fetch('https://control.preview.venjix.in/actions/gp-cloud-deploy', {
              method: 'POST',
              headers: {
                'Authorization': `Bearer ${token}`,
                'X-GitHub-Repository': `${context.repo.owner}/${context.repo.repo}`,
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({ pr_number: context.issue.number }),
            });
            const result = await response.json();
            if (!response.ok) core.setFailed(result.error || `gp-cloud returned ${response.status}`);
            core.setOutput('preview_url', result.preview_url);
            core.setOutput('deployment_id', result.id);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🚀 gp-cloud deployment queued for commit \`${result.sha}\`.\n\nPreview: ${result.preview_url}\nDeployment: \`${result.id}\``,
            });
